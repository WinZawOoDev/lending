services:
  gateway-service:
    build: ./gateway-service
    ports:
      - "8080:8080"
    depends_on:
      accounts-service:
        condition: service_healthy
      loans-service:
        condition: service_healthy
    networks:
      - lending-network

  accounts-db-setup:
    build:
      context: ./accounts-service
      target: db-setup
    environment:
      DATABASE_URL: postgresql://lending:lending@postgres:5432/accounts
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lending-network

  accounts-service:
    build: ./accounts-service
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://lending:lending@postgres:5432/accounts
      RABBITMQ_URL: amqp://lending:lending@rabbitmq:5672
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10
    depends_on:
      accounts-db-setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - lending-network

  loans-service:
    build: ./loans-service
    ports:
      - "5120:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=loans;Username=lending;Password=lending
      Elasticsearch__Uri: http://elasticsearch:9200
      RabbitMQ__Uri: amqp://lending:lending@rabbitmq:5672
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - lending-network

  postgres:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: lending
      POSTGRES_PASSWORD: lending
      POSTGRES_DB: lending
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lending -d lending"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lending-network

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lending.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lending-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks:
      - lending-network

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: lending
      RABBITMQ_DEFAULT_PASS: lending
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - lending-network

volumes:
  elasticsearch-data:
  rabbitmq-data:

networks:
  lending-network:
    driver: bridge
