services:
  accounts-service:
    build: ./accounts-service
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
    networks:
      - lending-network

  loans-service:
    build: ./loans-service
    ports:
      - "5120:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    networks:
      - lending-network

networks:
  lending-network:
    driver: bridge
